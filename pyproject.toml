[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qmagic"
version = "1.0.0"
description = "Cost model for hybrids of logical-level quantum error mitigation and magic-state cultivation in early fault-tolerant quantum computing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Hikaru Wakaura", email = "h.wakaura@qiri.co.jp" }, { name = "Taiki Tanimae", email = "t.tanimae@qiri.co.jp" }]
keywords = ["quantum error mitigation", "magic state cultivation", "magic state distillation", "surface code", "fault-tolerant quantum computing", "resource estimation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "stim==1.16.0",
    "pymatching==2.4.0",
]

[project.optional-dependencies]
cultivation = ["sinter==1.16.0", "chromobius==1.1.1", "pygltflib>=1.16", "networkx>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
qmagic-reproduce = "qmagic.reproduce:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qmagic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "quick: fast tests (<60s), no external repository needed",
    "slow: slow tests (>60s)",
    "full: post-reproduce validation (>10min)",
    "external: needs external/magic-state-cultivation (scripts/fetch_external.sh)",
]
